name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, beta/v1.00 ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish App
        # This points specifically to your sub-folder
        run: dotnet publish RedTowerAdventure.Web/RedTowerAdventure.Web.csproj -c Release -o output /p:BlazorEnableCompression=false

      - name: Fix Base Path
        # This ensures the browser looks in the /T4Dungeon/ subfolder for the game files
        run: sed -i 's/<base href="\/" \/>/<base href="\/T4Dungeon\/" \/>/g' output/wwwroot/index.html

      - name: Copy index to 404
        # This prevents the "MIME type" error on page refreshes
        run: cp output/wwwroot/index.html output/wwwroot/404.html

      - name: Commit and Push to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output/wwwroot
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}