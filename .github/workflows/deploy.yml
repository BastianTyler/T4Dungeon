name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, beta/v1.00 ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish App
        # We are publishing directly to the 'output' folder to keep it clean
        run: dotnet publish RedTowerAdventure.Web/RedTowerAdventure.Web.csproj -c Release -o output /p:BlazorEnableCompression=false

      - name: Fix Base Path
        # Updated path to match the output folder directly
        run: sed -i 's|<base href=".*" />|<base href="/T4Dungeon/" />|g' output/wwwroot/index.html

      - name: Add .nojekyll
        run: touch output/wwwroot/.nojekyll

      - name: Commit and Push to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output/wwwroot # This points to the actual web files
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}