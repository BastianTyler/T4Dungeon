name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, beta/v1.00 ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish App
        run: dotnet publish RedTowerAdventure.Web/RedTowerAdventure.Web.csproj -c Release -o output /p:BlazorWebAssemblyEnableCompression=false

      - name: Fix base path for GitHub Pages
        run: sed -i 's|<base href="/" />|<base href="/T4Dungeon/" />|g' output/wwwroot/index.html

      - name: Copy index to 404 fallback
        run: cp output/wwwroot/index.html output/wwwroot/404.html

      - name: Deploy to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output/wwwroot
          branch: gh-pages
          clean: true