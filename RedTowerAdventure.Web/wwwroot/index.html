<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Red Tower Adventure</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        html, body {
            margin: 0;
            background: #0d1f3c;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #terminal {
            width: 900px;
            height: 550px;
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,100,255,0.3);
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script>const term = new Terminal({ cursorBlink: true, fontSize: 16, fontFamily: 'Cascadia Code, Consolas, monospace', theme: { background: '#0a1628', foreground: '#00ff41', cursor: '#00ff41' } });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('terminal'));
        fit.fit();

        const ws = new WebSocket(`wss://${location.host}/ws`);
        ws.onmessage = e => term.write(e.data);
        term.onKey(({ key, domEvent }) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(key);
            }
        });</script>
</body>
</html>
