<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T4Dungeon</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RedTowerAdventure.Web.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body>
    <div id="app">
        <div style="color: #00FF00; background: black; height: 100vh; padding: 20px; font-family: 'Courier New';">
            Loading Red Tower OS...
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

    <script src="terminal.js"></script>

    <script>
        const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        const script = document.createElement('script');

        if (isLocal) {
            // Use the standard version for Visual Studio debugging
            script.src = "_framework/blazor.webassembly.js";
        } else {
            // Use the fingerprinted version for the GitHub build
            script.src = "_framework/blazor.webassembly#[.{fingerprint}].js";
        }
        document.body.appendChild(script);
    </script>
</body>
</html>
